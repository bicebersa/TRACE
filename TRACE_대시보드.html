<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRACE 대시보드</title>
<style>
/* 레이아웃: 상단 요약(KPI) → 사업비(차트 4개) → 주의 대상 TOP 10과 원인 상세 → 재무 요약. 외부 리소스 없이 동작 */
:root {
  --bg: #f3f5f4; --surface: #ffffff; --ink: #16231f; --muted: #5b6b66; --line: #d5ddd9; --grid: #e6ebe8;
  --accent: #17705a; --accent-soft: #e1f0ea; --prev: #9fb3ab; --budget: #b07d1f;
  --warn: #9a6512; --warn-soft: #fbf0dc; --crit: #b4372f; --crit-soft: #f8e2df; --info: #6b4fa0; --info-soft: #ece6f6;
  --csm: #2f5d9e; --csm-soft: #e3ebf7;
  --font: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --mono: Consolas, "SFMono-Regular", Menlo, ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #17201d; --ink: #e4ece8; --muted: #93a49e; --line: #2a3833; --grid: #222d29;
    --accent: #4fbf9a; --accent-soft: #183128; --prev: #5d7068; --budget: #d9a441;
    --warn: #e0a84a; --warn-soft: #33281a; --crit: #ef7a6e; --crit-soft: #3a1f1c; --info: #b49be0; --info-soft: #2a2238; --csm: #82a9e8; --csm-soft: #1b2638; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #17201d; --ink: #e4ece8; --muted: #93a49e; --line: #2a3833; --grid: #222d29;
  --accent: #4fbf9a; --accent-soft: #183128; --prev: #5d7068; --budget: #d9a441;
  --warn: #e0a84a; --warn-soft: #33281a; --crit: #ef7a6e; --crit-soft: #3a1f1c; --info: #b49be0; --info-soft: #2a2238; --csm: #82a9e8; --csm-soft: #1b2638; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.55; padding-inline: 16px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 24px 56px; display: grid; gap: 28px; }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
h1 { font-size: 24px; }
h2 { font-size: 17px; }
h3 { font-size: 14px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; color: var(--accent); font-weight: 700; }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
header.top .meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12.5px; }
.badge { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.badge.ok { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.badge.ng { background: var(--crit-soft); border-color: transparent; color: var(--crit); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 21px; font-weight: 700; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); }
.up { color: var(--crit); } .down { color: var(--accent); }

section { display: grid; gap: 12px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend i.line { height: 2px; border-radius: 0; vertical-align: 3px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font-family: var(--font); font-size: 11px; }
svg .val { fill: var(--ink); font-family: var(--mono); font-size: 10.5px; }

/* 부서별 예산 바 */
.brow { display: grid; grid-template-columns: 82px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 12.5px; }
.btrack { position: relative; height: 18px; background: var(--grid); border-radius: 4px; }
.btrack .ytd { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px 0 0 4px; }
.btrack .fc { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--accent) 0 3px, transparent 3px 6px); opacity: .55; }
.btrack .fc.over { background: repeating-linear-gradient(135deg, var(--crit) 0 3px, transparent 3px 6px); opacity: .8; }
.btrack .cap { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.brow .rt { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* 계정별 */
.arow { display: grid; grid-template-columns: 128px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 12.5px; }
.abars { display: grid; gap: 2px; }
.abars span { display: block; height: 7px; border-radius: 3px; }
.abars .c { background: var(--accent); } .abars .p { background: var(--prev); }
.arow .d { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.scroll { max-height: 360px; overflow-y: auto; display: grid; gap: 7px; padding-right: 4px; }

/* 상태 pill */
.pill { display: inline-block; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.pill.여유 { background: var(--accent-soft); color: var(--accent); }
.pill.주의 { background: var(--warn-soft); color: var(--warn); }
.pill.부족 { background: var(--crit-soft); color: var(--crit); }
.pill.무예산 { background: var(--info-soft); color: var(--info); }
.pill.높음 { background: var(--accent-soft); color: var(--accent); }
.pill.중간 { background: var(--warn-soft); color: var(--warn); }
.pill.참고 { background: var(--grid); color: var(--muted); }

/* TOP 10 + 상세 */
.watch { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 12px; align-items: start; }
@media (max-width: 980px) { .watch { grid-template-columns: 1fr; } }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 11.5px; color: var(--muted); font-weight: 600; white-space: nowrap; }
td.r, th.r { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr.pick { cursor: pointer; }
tbody tr.pick:hover td { background: var(--grid); }
tbody tr.pick[aria-selected="true"] td { background: var(--accent-soft); }
tbody tr.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.rank { font-family: var(--mono); font-weight: 700; color: var(--accent); }
.sig { font-size: 11.5px; color: var(--muted); }
.detail h3 { font-size: 16px; }
.summary { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 9px 12px; border-radius: 0 8px 8px 0; font-size: 13.5px; }
.cands { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.cands li { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; font-size: 13px; }
.cands li b { font-weight: 700; }
.cands .t { grid-column: 2; color: var(--muted); font-size: 12.5px; }
.vrow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 2fr) 64px 44px; gap: 8px; align-items: center; font-size: 12.5px; }
.vbar { height: 10px; background: var(--grid); border-radius: 5px; position: relative; overflow: hidden; }
.vbar i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--accent); border-radius: 5px; }
.vbar i.neg { background: var(--prev); }
.new { font-size: 10.5px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 0 5px; margin-left: 4px; }
.neg-amt { color: var(--crit); }
.comment { font-size: 12.5px; color: var(--muted); }
.comment b { color: var(--ink); font-weight: 600; }

.tgt { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.tgt.csm { background: var(--csm-soft); color: var(--csm); } .tgt.pl { background: var(--warn-soft); color: var(--warn); } .tgt.sep { background: var(--grid); color: var(--muted); }
.stack { display: flex; height: 22px; border-radius: 5px; overflow: hidden; }
.stack span { display: block; height: 100%; }
.summary17 { border-left: 3px solid var(--csm); background: var(--csm-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 13.5px; }
.topnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--ink); color: var(--bg); margin-inline: -16px; padding: 0 16px; }
.topnav .in { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; min-height: 48px; }
.topnav .brand { font-weight: 800; letter-spacing: .06em; font-size: 16px; color: var(--bg); text-decoration: none; }
.topnav .brand small { font-weight: 500; letter-spacing: 0; opacity: .7; font-size: 12px; margin-left: 6px; }
.topnav nav { display: flex; flex-wrap: wrap; gap: 2px; }
.topnav nav a { color: var(--bg); opacity: .78; text-decoration: none; font-size: 13.5px; padding: 6px 10px; border-radius: 6px; }
.topnav nav a:hover { opacity: 1; background: color-mix(in srgb, var(--bg) 14%, transparent); }
.topnav nav a[aria-current="page"] { opacity: 1; font-weight: 700; background: color-mix(in srgb, var(--bg) 18%, transparent); }
.topnav .tools { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; }
.topnav .tools .badge { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 35%, transparent); max-width: 380px; overflow: hidden; text-overflow: ellipsis; }
.topnav .tools .badge.ng { color: #ffb3a8; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 0; }
.tabs button { font: inherit; font-size: 14px; color: var(--muted); background: none; border: none; border-bottom: 3px solid transparent; padding: 8px 12px; cursor: pointer; margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 860px) { .hl { grid-template-columns: 1fr; } }
.hl ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.linkbtn { font: inherit; font-size: 12.5px; color: var(--accent); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { font: inherit; font-size: 12px; background: none; border: none; padding: 3px 10px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 700; }
.loadbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); margin-inline: -16px; padding: 8px 16px; }
.loadbar .in { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 12.5px; }
.btn { font: inherit; font-size: 13px; font-weight: 600; color: #fff; background: var(--accent); border: none; border-radius: 8px; padding: 6px 14px; cursor: pointer; }
.btn:hover { filter: brightness(1.08); } .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.drop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 18%, transparent); border: 3px dashed var(--accent); font-size: 18px; font-weight: 700; color: var(--accent); pointer-events: none; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; display: grid; gap: 8px; }
footer { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="topnav"><div class="in">
  <a class="brand" href="TRACE_대시보드.html">TRACE<small>사업비 원인추적기</small></a>
  <nav aria-label="TRACE 페이지">
    <a href="TRACE_대시보드.html" aria-current="page">대시보드</a>
    <a href="TRACE_흐름.html">처리 흐름</a>
    <a href="TRACE_IFRS17_연결.html">IFRS 17 연결</a>
    <a href="TRACE_사용설명서.html">사용설명서</a>
  </nav>
  <div class="tools">
    <span class="badge" id="ld-status" title="불러온 자료">자료 없음</span>
    <button type="button" class="btn" id="ld-btn" title="TRACE 엑셀(.xlsx·.xlsm) 또는 data.js·.json · 화면에 끌어다 놓아도 됩니다">자료 불러오기</button>
    <input type="file" id="ld-file" accept=".xlsx,.xlsm,.json,.js" hidden>
  </div>
</div></header>
<div class="drop" id="drop" hidden>여기에 놓으면 불러옵니다</div>
<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");

  // ---------- 서식
  function fmt(v, d) {
    if (v === null || v === undefined || v === "") return "-";
    d = d === undefined ? 0 : d;
    var s = Math.abs(v).toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });
    return (v < 0 ? "△" : "") + s;
  }
  function pct(v, signed) {
    if (v === null || v === undefined || v === "") return "-";
    var s = (Math.abs(v) * 100).toFixed(Math.abs(v) < 0.1 ? 1 : 0) + "%";
    if (!signed) return (v < 0 ? "△" : "") + s;
    return (v > 0 ? "+" : v < 0 ? "−" : "") + s;
  }
  function esc(s) { return String(s === null || s === undefined ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function statusCls(s) { return /부족|초과/.test(s || "") ? "부족" : (s || ""); }
  function el(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
  function niceMax(v) { if (v <= 0) return 1; var p = Math.pow(10, Math.floor(Math.log10(v))); var n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }

  // ---------- SVG 차트
  function barChart(o) {
    var W = 560, H = 230, L = 52, R = 8, T = 10, B = 26, n = o.labels.length, k = o.series.length;
    var all = []; o.series.forEach(function (s) { all = all.concat(s.values); }); if (o.line) all = all.concat(o.line.values);
    var max = niceMax(Math.max.apply(null, all.concat([0])));
    var cw = (W - L - R) / n, bw = Math.min(16, (cw - 8) / k);
    var y = function (v) { return T + (H - T - B) * (1 - v / max); };
    var g = "";
    for (var i = 0; i <= 4; i++) {
      var v = max * i / 4, yy = y(v);
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--grid)"/>';
      g += '<text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + fmt(v) + '</text>';
    }
    o.labels.forEach(function (lab, i) {
      var x0 = L + cw * i + (cw - bw * k) / 2;
      o.series.forEach(function (s, j) {
        var v = s.values[i]; if (!v) return;
        g += '<rect x="' + (x0 + j * bw) + '" y="' + y(Math.max(v, 0)) + '" width="' + (bw - 1.5) + '" height="' + Math.abs(y(0) - y(v)) + '" rx="1.5" fill="' + s.color + '"><title>' + esc(lab + " " + s.name + ": " + fmt(v, 1)) + '</title></rect>';
      });
      g += '<text x="' + (L + cw * i + cw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(lab) + '</text>';
    });
    if (o.line) {
      var pts = o.line.values.map(function (v, i) { return (L + cw * i + cw / 2) + "," + y(v); }).join(" ");
      g += '<polyline points="' + pts + '" fill="none" stroke="' + o.line.color + '" stroke-width="2" stroke-dasharray="5 4"/>';
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label) + '">' + g + '</svg>';
  }
  function lineChart(o) {
    var W = 560, H = 230, L = 64, R = 10, T = 10, B = 26, n = o.labels.length;
    var all = []; o.series.forEach(function (s) { all = all.concat(s.values); });
    var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all), pad = (mx - mn) * 0.12 || mx * 0.05;
    var lo = Math.max(0, mn - pad), hi = mx + pad, step = niceMax((hi - lo) / 4);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    var x = function (i) { return L + (W - L - R) * (n === 1 ? 0.5 : i / (n - 1)); };
    var y = function (v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); };
    var g = "";
    for (var v = lo; v <= hi + step / 2; v += step) {
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--grid)"/>';
      g += '<text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + fmt(v) + '</text>';
    }
    o.labels.forEach(function (lab, i) { if (i % 2 === 0 || i === n - 1) g += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(lab.slice(2)) + '</text>'; });
    o.series.forEach(function (s) {
      g += '<polyline points="' + s.values.map(function (v, i) { return x(i) + "," + y(v); }).join(" ") + '" fill="none" stroke="' + s.color + '" stroke-width="2.2"/>';
      var li = s.values.length - 1;
      g += '<circle cx="' + x(li) + '" cy="' + y(s.values[li]) + '" r="3.5" fill="' + s.color + '"/>';
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label) + '">' + g + '</svg>';
  }
  function donut(items) {
    var total = items.reduce(function (a, b) { return a + b.count; }, 0) || 1, a0 = -Math.PI / 2, g = "", R = 70, r = 44, cx = 90, cy = 90;
    items.forEach(function (it) {
      if (!it.count) return;
      var a1 = a0 + 2 * Math.PI * it.count / total, big = a1 - a0 > Math.PI ? 1 : 0;
      if (it.count === total) a1 -= 0.0001;
      var p = function (rad, a) { return (cx + rad * Math.cos(a)) + " " + (cy + rad * Math.sin(a)); };
      g += '<path d="M ' + p(R, a0) + ' A ' + R + ' ' + R + ' 0 ' + big + ' 1 ' + p(R, a1) + ' L ' + p(r, a1) + ' A ' + r + ' ' + r + ' 0 ' + big + ' 0 ' + p(r, a0) + ' Z" fill="' + it.color + '"><title>' + esc(it.status + " " + it.count + "건") + '</title></path>';
      a0 = a1;
    });
    g += '<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" class="val" style="font-size:20px;font-weight:700">' + total + '</text>';
    g += '<text x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle">부서×계정</text>';
    return '<svg viewBox="0 0 180 180" style="max-width:190px" role="img" aria-label="분기 한도 판정 분포">' + g + '</svg>';
  }

  // ---------- 그리기 (불러온 자료로 화면 전체를 다시 그림)
  function render(D) {
  app.innerHTML = "";

      '<div class="card"><div class="card-head"><h3>포트폴리오별 경험차이 (예정 − 실제)</h3></div><div class="tbl-wrap"><table><thead><tr><th>포트폴리오</th><th class="r">신계약비</th><th class="r">유지비</th><th class="r">수금비</th></tr></thead><tbody>' + pfRows + '</tbody></table></div>' +
      '<div class="legend"><span>CSM 조정 GMM <b class="num">' + fmt(X.totals.csm, 1) + '</b></span>' + (X.totals.csmVfa !== undefined ? '<span>CSM 조정 VFA <b class="num">' + fmt(X.totals.csmVfa, 1) + '</b></span>' : '') + '<span>당기손익 <b class="num">' + fmt(X.totals.pl, 1) + '</b></span></div></div>' +
      '<div class="card"><div class="card-head"><h3>당월 사업비 배분</h3></div><div class="stack">' + stack + '</div><div class="legend" style="gap:8px 16px">' + allocLeg + '</div>' +
      '<h3 style="margin-top:6px">신계약비 증가 기여 (전월 대비)</h3><div class="tbl-wrap"><table><thead><tr><th>부서 · 계정</th><th class="r">당월</th><th class="r">전월</th><th class="r">증감</th></tr></thead><tbody>' + drv + '</tbody></table></div></div>' +
      '<div class="card"><div class="card-head"><h3>근거 전표 (귀속 신계약비 큰 순)</h3></div><div class="tbl-wrap"><table><thead><tr><th>일자</th><th>거래처</th><th>적요</th><th class="r">신계약 귀속</th></tr></thead><tbody>' + ev17 + '</tbody></table></div>' +
      '<h3 style="margin-top:6px">변동표 대사 (계리 F31 vs TRACE)</h3><div class="tbl-wrap"><table><thead><tr><th>포트폴리오</th><th class="r">계리</th><th class="r">TRACE</th><th>판정</th></tr></thead><tbody>' + rec + '</tbody></table></div></div>' +
      '</div></section>'));
  }

  // ---------- 재무 요약
  var bsl = D.bs.map(function (r) { return r.period; });
  app.appendChild(el('<section data-tab="finance"><div class="sec-head"><span class="eyebrow">BS · PL</span><h2>재무 요약</h2><span class="muted">BS 최근 12개월 월말 · PL 월별</span></div><div class="grid2">' +
    '<div class="card"><div class="card-head"><h3>재무상태 추이</h3><div class="legend"><span><i style="background:var(--accent)"></i>자산총계</span><span><i style="background:var(--prev)"></i>부채총계</span></div></div>' +
    lineChart({ label: "자산·부채 추이", labels: bsl, series: [{ values: D.bs.map(function (r) { return r.assets; }), color: "var(--accent)" }, { values: D.bs.map(function (r) { return r.liabilities; }), color: "var(--prev)" }] }) + '</div>' +
    '<div class="card"><div class="card-head"><h3>자본총계 · 보험계약마진(CSM)</h3><div class="legend"><span><i style="background:var(--accent)"></i>CSM</span><span><i style="background:var(--budget)"></i>자본총계</span></div></div>' +
    lineChart({ label: "자본·CSM 추이", labels: bsl, series: [{ values: D.bs.map(function (r) { return r.csm; }), color: "var(--accent)" }, { values: D.bs.map(function (r) { return r.equity; }), color: "var(--budget)" }] }) + '</div>' +
    '<div class="card"><div class="card-head"><h3>월별 당기순이익</h3><div class="legend"><span><i style="background:var(--accent)"></i>당해</span><span><i style="background:var(--prev)"></i>전년</span></div></div>' +
    barChart({ label: "월별 당기순이익", labels: D.pl.map(function (r) { return r.month; }), series: [{ name: "당해", values: D.pl.map(function (r) { return r.niCur; }), color: "var(--accent)" }, { name: "전년", values: D.pl.map(function (r) { return r.niPrev; }), color: "var(--prev)" }] }) + '</div>' +
    '<div class="card"><div class="card-head"><h3>당해 손익 구성</h3><div class="legend"><span><i style="background:var(--accent)"></i>보험손익</span><span><i style="background:var(--budget)"></i>투자손익</span><span><i style="background:var(--crit)"></i>사업비</span></div></div>' +
    barChart({ label: "손익 구성", labels: D.pl.map(function (r) { return r.month; }), series: [{ name: "보험손익", values: D.pl.map(function (r) { return r.insCur; }), color: "var(--accent)" }, { name: "투자손익", values: D.pl.map(function (r) { return r.invCur; }), color: "var(--budget)" }, { name: "사업비", values: D.pl.map(function (r) { return r.expCur; }), color: "var(--crit)" }] }) + '</div>' +
    '</div></section>'));

  app.appendChild(el('<footer>TRACE (Trend · Risk · Anomaly · Cause · Expense) · 원인 후보는 규칙 기반 가설입니다. 근거 전표와 담당 부서 확인으로 확정하세요. 원본: TRACE_v0.4 엑셀 → [대시보드 내보내기]로 생성된 data.js</footer>'));
  if (!app.dataset.wired) { app.dataset.wired = "1"; app.addEventListener("click", function (e) {
    var go = e.target.closest("[data-go]"); if (go) { showTab(go.getAttribute("data-go")); window.scrollTo(0, 0); return; }
    var mb = e.target.closest(".seg button[data-m]");
    if (mb) { var card = mb.closest(".card"), m = mb.getAttribute("data-m");
      card.querySelectorAll(".seg button").forEach(function (b) { b.setAttribute("aria-pressed", b === mb ? "true" : "false"); });
      card.querySelectorAll("div[data-m]").forEach(function (d) { d.hidden = d.getAttribute("data-m") !== m; }); }
  }); }
  var want = (location.hash || "").replace("#", "");
  showTab(TABS.some(function (t) { return t[0] === want; }) ? want : "summary");
  }

  function showTab(id) {
    app.querySelectorAll("section[data-tab]").forEach(function (sec) { sec.hidden = sec.getAttribute("data-tab") !== id; });
    app.querySelectorAll(".tabs button").forEach(function (b) { b.setAttribute("aria-selected", b.getAttribute("data-go") === id ? "true" : "false"); });
    try { history.replaceState(null, "", "#" + id); } catch (e) { /* 일부 환경에서는 주소 변경이 막혀 있음 */ }
  }

  // ---------- 자료 불러오기: data.js · JSON · TRACE 엑셀 (외부 라이브러리 없이 브라우저에서 직접 읽음)
  var statusEl = document.getElementById("ld-status"), fileIn = document.getElementById("ld-file"), drop = document.getElementById("drop");
  function setStatus(t, bad) { statusEl.textContent = t; statusEl.className = "badge " + (bad ? "ng" : "ok"); }
  function showEmpty(msg) {
    app.innerHTML = '<div class="empty"><h2>대시보드 자료를 불러오세요</h2><p class="muted">' + esc(msg) + '</p><div><button type="button" class="btn" id="ld-empty">파일 선택</button></div></div>';
    document.getElementById("ld-empty").addEventListener("click", function () { fileIn.click(); });
  }
  function parseDataText(t) {
    var i = t.indexOf("{"), j = t.lastIndexOf("}");
    if (i < 0 || j < i) throw new Error("JSON 형식이 아닙니다");
    return JSON.parse(t.slice(i, j + 1));
  }
  function loadFile(f) {
    setStatus("불러오는 중: " + f.name);
    var isBook = /\.(xlsx|xlsm)$/i.test(f.name);
    var job = isBook ? f.arrayBuffer().then(function (b) { return fromWorkbook(b, f); }) : f.text().then(parseDataText);
    job.then(function (D) {
      if (!D || !D.meta || !D.kpi) throw new Error("TRACE 대시보드 자료가 아닙니다");
      render(D);
      setStatus(f.name + " · " + new Date(f.lastModified).toLocaleString("ko-KR") + (D._partial ? " · 원인 상세는 선택된 1건만" : ""));
    }).catch(function (e) { setStatus("불러오기 실패: " + e.message, true); });
  }
  fileIn.addEventListener("change", function () { if (fileIn.files[0]) loadFile(fileIn.files[0]); fileIn.value = ""; });
  document.getElementById("ld-btn").addEventListener("click", function () { fileIn.click(); });
  var dragN = 0;
  window.addEventListener("dragenter", function (e) { e.preventDefault(); dragN++; drop.hidden = false; });
  window.addEventListener("dragleave", function () { if (--dragN <= 0) { dragN = 0; drop.hidden = true; } });
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("drop", function (e) { e.preventDefault(); dragN = 0; drop.hidden = true; var f = e.dataTransfer.files[0]; if (f) loadFile(f); });

  // ZIP(엑셀 파일) 읽기
  function readZip(buf) {
    var dv = new DataView(buf), eocd = -1;
    for (var i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error("엑셀 파일 형식이 아닙니다");
    var n = dv.getUint16(eocd + 10, true), p = dv.getUint32(eocd + 16, true), files = {}, dec = new TextDecoder();
    for (var k = 0; k < n; k++) {
      var nl = dv.getUint16(p + 28, true), el_ = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
      files[dec.decode(new Uint8Array(buf, p + 46, nl))] = { method: dv.getUint16(p + 10, true), size: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true) };
      p += 46 + nl + el_ + cl;
    }
    return function read(name) {
      var f = files[name];
      if (!f) return Promise.resolve(null);
      var start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true), raw = new Uint8Array(buf, start, f.size);
      if (f.method === 0) return Promise.resolve(dec.decode(raw));
      var ds = new DecompressionStream("deflate-raw");
      return new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer().then(function (b) { return dec.decode(b); });
    };
  }
  function fromWorkbook(buf, file) {
    if (typeof DecompressionStream === "undefined") return Promise.reject(new Error("이 브라우저는 엑셀 파일 읽기를 지원하지 않습니다. Edge·Chrome 최신 버전을 쓰거나 data.js를 올려주세요"));
    var read = readZip(buf), X = new DOMParser(), sheets = {}, ss = [];
    var xml = function (t) { return X.parseFromString(t, "application/xml"); };
    return Promise.all([read("xl/workbook.xml"), read("xl/_rels/workbook.xml.rels"), read("xl/sharedStrings.xml")]).then(function (r) {
      if (!r[0]) throw new Error("엑셀 통합문서가 아닙니다");
      var rmap = {};
      [].forEach.call(xml(r[1]).getElementsByTagName("Relationship"), function (x) { rmap[x.getAttribute("Id")] = "xl/" + x.getAttribute("Target").replace(/^\/?xl\//, "").replace(/^\//, ""); });
      [].forEach.call(xml(r[0]).getElementsByTagName("sheet"), function (x) { sheets[x.getAttribute("name")] = rmap[x.getAttribute("r:id")]; });
      if (r[2]) [].forEach.call(xml(r[2]).getElementsByTagName("si"), function (si) { var t = ""; [].forEach.call(si.getElementsByTagName("t"), function (x) { t += x.textContent; }); ss.push(t); });
      function sheet(nm) {
        if (!sheets[nm]) return Promise.reject(new Error("TRACE 엑셀이 아닙니다 (" + nm + " 시트 없음)"));
        return read(sheets[nm]).then(function (t) {
          var S = {};
          [].forEach.call(xml(t).getElementsByTagName("c"), function (c) {
            var ty = c.getAttribute("t"), v = c.getElementsByTagName("v")[0], val = null;
            if (ty === "s" && v) val = ss[+v.textContent];
            else if (ty === "str" && v) val = v.textContent;
            else if (ty === "inlineStr") { val = ""; [].forEach.call(c.getElementsByTagName("t"), function (x) { val += x.textContent; }); }
            else if (ty === "b" && v) val = v.textContent === "1";
            else if (ty !== "e" && v) val = parseFloat(v.textContent);
            S[c.getAttribute("r")] = val;
          });
          return S;
        });
      }
      if (sheets["대시보드데이터"]) return sheet("대시보드데이터").then(function (S) {
        var n = +S.B1 || 0, t = "";
        for (var i = 2; i < 2 + n; i++) t += S["A" + i] || "";
        return parseDataText(t);
      });
      return assemble(sheet, file);
    });
  }
  // 매크로를 돌리지 않은 엑셀: 시트에 저장된 계산값으로 자료를 만든다
  function assemble(sheet, file) {
    var names = ["설정", "자가진단", "계정변동", "차트데이터", "주의대상", "원인분석", "IFRS17_사업비"];
    return Promise.all(names.map(sheet)).then(function (a) {
      var st = a[0], ck = a[1], av = a[2], cd = a[3], wt = a[4], ca = a[5], ia = a[6];
      if (st.C6 === null || st.C6 === undefined || ck.B4 === null || ck.B4 === undefined) throw new Error("계산 결과가 저장되지 않은 파일입니다. 엑셀에서 연 뒤 저장해서 올려주세요");
      var COLS = "ABCDEFGHI";
      function headerRow(S, col, label, nth) {
        var hit = 0;
        for (var r = 1; r < 400; r++) { var v = S[col + r]; if (typeof v === "string" && v.replace(/\s/g, "") === label.replace(/\s/g, "")) { if (++hit === (nth || 1)) return r; } }
        return -1;
      }
      function rows(S, r0, keys, max, stop) {
        var out = [];
        for (var r = r0; r < r0 + (max || 40); r++) {
          var a0 = S["A" + r];
          if (a0 === null || a0 === undefined || a0 === "" || (stop && typeof a0 === "string" && stop.test(a0))) break;
          var o = {}; keys.forEach(function (k, i) { o[k] = S[COLS[i] + r] === undefined ? null : S[COLS[i] + r]; }); out.push(o);
        }
        return out;
      }
      function after(S, label, keys, nth, max, stop) { var h = headerRow(S, "A", label, nth); return h < 0 ? [] : rows(S, h + 1, keys, max, stop); }
      function day(v) { if (typeof v !== "number") return v; var d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5); return d.toISOString().slice(0, 10); }
      var recon = "-"; for (var r = 6; r < 80; r++) { var pv = av["P" + r]; if (typeof pv === "string" && /전체|있음/.test(pv)) { recon = pv; break; } }
      var D = { _partial: true, meta: { company: st.C5, period: st.C6 + "-" + String(st.C7).padStart(2, "0"), unit: st.C9, check: ck.B4, recon: recon, generated: "엑셀 파일 (" + new Date(file.lastModified).toLocaleDateString("ko-KR") + ")" } };
      D.kpi = after(cd, "지표", ["label", "value", "compare", "rate", "basis"]);
      D.kpi.forEach(function (k) { if (typeof k.rate !== "number") k.rate = null; });
      D.monthly = after(cd, "월", ["month", "cur", "prev", "budget"], 1, 12);
      D.depts = after(cd, "부서코드", ["code", "name", "avail", "ytd", "forecast", "rate", "status"]);
      D.status = after(cd, "분기 판정", ["status", "count"], 1, 5);
      D.accounts = after(cd, "G/L 계정", ["gl", "name", "cur", "prevYear", "diff"]);
      D.bs = after(cd, "기간번호", ["p", "period", "assets", "liabilities", "equity", "csm", "invested"], 1, 12);
      D.pl = after(cd, "월", ["month", "niCur", "niPrev", "insCur", "invCur", "expCur", "insPrev"], 2, 12);
      var selKey = ca.C9, noCause = { summary: "원인 상세는 엑셀에서 [대시보드 내보내기]를 실행하고 저장한 파일, 또는 data.js를 올리면 TOP 10 모두 표시됩니다. 지금은 원인분석 시트에서 선택된 항목만 보입니다.", candidates: [], vendors: [], evidence: [] };
      function causeFromSheet() {
        var c = { summary: ca.A18, curTotal: ca.A16, cmpTotal: ca.B16, diff: ca.C16, candidates: [], vendors: [], evidence: [] };
        for (var r = 21; r <= 28; r++) if (ca["B" + r]) c.candidates.push({ pattern: ca["B" + r], strength: ca["C" + r] || null, text: ca["D" + r] });
        for (r = 32; r <= 46; r++) if (ca["A" + r]) c.vendors.push({ name: ca["A" + r], cur: ca["B" + r], cmp: ca["C" + r], diff: ca["D" + r], share: typeof ca["E" + r] === "number" ? ca["E" + r] : null, isNew: ca["I" + r] });
        for (r = 51; r <= 65; r++) if (ca["B" + r]) c.evidence.push({ date: day(ca["A" + r]), doc: String(ca["B" + r]), type: ca["C" + r], vendor: ca["D" + r], text: ca["E" + r], amt: ca["F" + r] });
        return c;
      }
      D.top10 = [];
      for (r = 6; r <= 15; r++) {
        if (!wt["B" + r]) continue;
        D.top10.push({ rank: wt["A" + r], dept: wt["B" + r], account: wt["C" + r], cur: wt["D" + r], mom: wt["E" + r], yoy: wt["F" + r], status: wt["G" + r], qrate: wt["H" + r], annual: wt["I" + r] || null,
          signal: wt["J" + r] || null, score: wt["K" + r], comment: wt["M" + r], cause: wt["L" + r] === selKey ? causeFromSheet() : noCause });
      }
      var X = { summary: ia.A5 };
      X.alloc = after(ia, "구분", ["cat", "cur", "prev", "ytd", "share"], 1, 8, /^합계/);
      X.pf = after(ia, "포트폴리오", ["pf", "name", "model", "cat", "actual", "expected", "diff", "target"], 1, 40, /^(CSM|당기|구분)/);
      X.totals = { csm: null, csmVfa: null, pl: null };
      for (r = 1; r < 200; r++) { var t = ia["A" + r]; if (typeof t !== "string") continue; if (/^CSM 조정 \(GMM/.test(t)) X.totals.csm = ia["G" + r]; else if (/^CSM 조정 \(VFA/.test(t)) X.totals.csmVfa = ia["G" + r]; else if (/^당기손익 \(/.test(t)) X.totals.pl = ia["G" + r]; }
      X.recon = after(ia, "포트폴리오", ["pf", "model", "actuary", "trace", "diff", "status"], 2, 10);
      X.bridge = after(ia, "요인코드", ["code", "name", "bel", "ra", "csm", "expense"], 1, 15);
      X.bridgeVfa = after(ia, "요인코드", ["code", "name", "bel", "ra", "csm", "expense"], 2, 15);
      var nC = 0, nE = 0;
      for (r = 1; r < 200; r++) { var b = ia["B" + r]; if (typeof b !== "string") continue;
        if (/^CSM 당월 변동/.test(b)) { if (nC++ === 0) X.csmChange = ia["E" + r]; else X.csmChangeVfa = ia["E" + r]; }
        if (/^그중 사업비/.test(b)) { if (nE++ === 0) X.csmExpense = ia["E" + r]; else X.csmExpenseVfa = ia["E" + r]; } }
      X.drivers = after(ia, "순위", ["rank", "dept", "account", "cur", "prev", "diff"], 1, 5);
      X.evidence = after(ia, "전기일", ["date", "doc", "cc", "gl", "vendor", "text", "amt", "nb"], 1, 10).map(function (e) { e.date = day(e.date); e.doc = e.doc == null ? null : String(e.doc); return e; });
      D.ifrs17 = X;
      return D;
    });
  }

  window.TRACE_LOAD = loadFile;   // 테스트·자동화용
  if (window.TRACE_DATA) { render(window.TRACE_DATA); setStatus("data.js (같은 폴더)"); }
  else showEmpty("같은 폴더에 data.js가 없습니다. 위의 [자료 불러오기]로 TRACE 엑셀이나 data.js를 고르거나, 이 화면에 파일을 끌어다 놓으세요.");
})();
